name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            desktop/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q desktop/tests
        env:
          PYTHONPATH: desktop
      - run: ruff check desktop
      - run: python -m compileall -q desktop
      - run: bash -n build.sh
